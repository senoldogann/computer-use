name: Temporary completion patch

on:
  push:
    branches:
      - audit/completion-auditor-fail-closed-2026-09-07

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/completion-auditor-fail-closed-2026-09-07
      - name: Apply guarded completion patch
        run: python scripts/_apply_completion_fail_closed.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/computeruse/orchestrator/loop.py src/computeruse/orchestrator/prompts.py tests/smoke/test_prompts.py
          git diff --cached --check
          git commit -m "fix(completion): fail closed on unverifiable success"
          git push origin HEAD:audit/completion-auditor-fail-closed-2026-09-07
