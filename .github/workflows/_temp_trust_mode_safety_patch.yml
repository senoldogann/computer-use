name: Temporary trust-mode safety patch

on:
  push:
    branches:
      - audit/trust-mode-destructive-boundary-2026-09-07

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/trust-mode-destructive-boundary-2026-09-07
      - name: Apply bounded trust-mode patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/computeruse/agent.py",
              """    # Trust mode (--yes): the operator has explicitly asked for uninterrupted
              # autonomy. CONFIRM decisions are auto-approved and logged, BLOCK still
              # blocks, kill-switch/budget/verification/stuck-guard still run. This is
              # delegation in advance, not removal of the guard.""",
              """    # Trust mode (--yes): the operator asked to skip routine/non-destructive
              # confirmations. DESTRUCTIVE decisions still require an explicit scoped
              # grant or a single-use human approval; BLOCK still blocks, and the
              # kill-switch/budget/verification/stuck-guard safety floor still runs.""",
          )

          replace_once(
              "src/computeruse/agent.py",
              """    ``auto_approve`` is trust mode (--yes): CONFIRM becomes ALLOW, BLOCK still
              blocks. The safety floor (kill-switch, budget, verification, stuck-guard)
              keeps running; only the human prompt is skipped, and the caller logs it.""",
              """    ``auto_approve`` is trust mode (--yes): non-destructive CONFIRM becomes
              ALLOW, while DESTRUCTIVE keeps the explicit-confirmation boundary unless a
              scoped capability grant or consumed approval already authorised it. BLOCK
              still blocks, and the safety floor keeps running.""",
          )

          replace_once(
              "src/computeruse/agent.py",
              """        if auto_approve and base is PermissionDecision.CONFIRM:
                      LOGGER.info(
                          "trust mode: auto-approved %s for %r (risk=%s)",
                          turn.action.type,
                          turn.sub_goal,
                          risk.value,
                      )
                      return PermissionDecision.ALLOW""",
              """        if (
                      auto_approve
                      and base is PermissionDecision.CONFIRM
                      and risk is not Risk.DESTRUCTIVE
                  ):
                      LOGGER.info(
                          "trust mode: auto-approved non-destructive %s for %r (risk=%s)",
                          turn.action.type,
                          turn.sub_goal,
                          risk.value,
                      )
                      return PermissionDecision.ALLOW""",
          )

          replace_once(
              "src/computeruse/cli.py",
              'help="Trust mode: auto-approve every CONFIRM without prompting, so "',
              'help="Trust mode: auto-approve non-destructive CONFIRM decisions without prompting, so "',
          )

          replace_once(
              "src/computeruse/cli.py",
              """    # Trust mode (--yes) overrides both: the operator explicitly asked for
              # uninterrupted autonomy, so CONFIRM is auto-approved with a log line.""",
              """    # Trust mode (--yes) skips non-destructive confirmation prompts. Destructive
              # actions keep the explicit approval/grant boundary even in unattended mode.""",
          )

          replace_once(
              "driver/src/menu.rs",
              "/// Trust mode (--yes): auto-approve CONFIRM without prompting.",
              "/// Trust mode (--yes): auto-approve non-destructive CONFIRM without prompting.",
          )

          replace_once(
              "driver/assets/menu.html",
              "// Trust mode (--yes): auto-approve CONFIRM, keep BLOCK + kill-switch.",
              "// Trust mode (--yes): auto-approve non-destructive CONFIRM only; keep destructive confirmation + BLOCK + kill-switch.",
          )
          PY
          python -m py_compile src/computeruse/agent.py src/computeruse/cli.py
          git diff --check

      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/computeruse/agent.py src/computeruse/cli.py driver/src/menu.rs driver/assets/menu.html
          git diff --cached --check
          git commit -m "fix(safety): keep destructive confirmation under trust mode"
          git push origin HEAD:audit/trust-mode-destructive-boundary-2026-09-07
