name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant runs on the same branch/PR (saves runner minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust: test + clippy ──────────────────────────────────────────
  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            driver/target
          key: cargo-${{ runner.os }}-${{ hashFiles('driver/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build driver binary
        run: cargo build

      - name: Run tests
        run: cargo test --all-targets

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Upload driver binary for Python job
        uses: actions/upload-artifact@v4
        with:
          name: driver-binary
          path: driver/target/debug/actuation-driver
          retention-days: 1

  # ── Python: lint + typecheck + test ──────────────────────────────
  python:
    name: Python (ruff + pyright + pytest)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --dev

      - name: Download driver binary
        uses: actions/download-artifact@v4
        with:
          name: driver-binary
          path: driver/target/debug

      - name: Make driver binary executable
        run: chmod +x driver/target/debug/actuation-driver

      - name: Verify driver binary
        run: |
          ls -la driver/target/debug/actuation-driver
          file driver/target/debug/actuation-driver

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright typecheck
        run: uv run pyright

      - name: Pytest
        run: |
          set +e
          uv run pytest -q --tb=short > /tmp/pytest.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::group::pytest tail"
            tail -50 /tmp/pytest.log
            echo "::endgroup::"
            while IFS= read -r line; do
              line=${line//%/\%25}
              line=${line//$'\r'/}
              echo "::error::PYTEST: $line"
            done < <(tail -25 /tmp/pytest.log)
            echo "## Pytest failure output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -60 /tmp/pytest.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            tail -5 /tmp/pytest.log
          fi
          exit $rc
