name: Sovereign core patch

on:
  push:
    branches: [feat/sovereign-mode-core]

permissions:
  contents: write

jobs:
  task2:
    if: contains(github.event.head_commit.message, 'apply sovereign task2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sovereign-mode-core

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --dev

      - name: Patch sovereign guard composition exactly
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/computeruse/agent.py')
          text = path.read_text(encoding='utf-8')

          old_import = '''from computeruse.security.autonomy import (
    AutonomyLevel,
    PermissionDecision,
    Risk,
    classify_risk,
)
'''
          new_import = '''from computeruse.security.autonomy import (
    AutonomyLevel,
    PermissionDecision,
    Risk,
    classify_risk,
    decide_permission,
)
'''
          if text.count(old_import) != 1:
              raise SystemExit('autonomy import marker not unique')
          text = text.replace(old_import, new_import, 1)

          old_guard = '''        risk = classify_risk(turn, target_label=label)
        verdict = (
            authorize(turn, label)
            if authorize is not None and risk is Risk.DESTRUCTIVE
            else None
        )
        base = decide_with_grant(level, risk, verdict)
'''
          new_guard = '''        risk = classify_risk(turn, target_label=label)
        # Resolve the selected autonomy policy before consulting delegated
        # authority. Sovereign already ALLOWs destructive work by explicit
        # session policy, so spending/reading grants there would be both
        # unnecessary and misleading. FULL/GUARDED still consult grants only
        # when their base policy actually requires confirmation.
        base = decide_permission(level, risk)
        if (
            base is PermissionDecision.CONFIRM
            and risk is Risk.DESTRUCTIVE
            and authorize is not None
        ):
            base = decide_with_grant(level, risk, authorize(turn, label))
'''
          if text.count(old_guard) != 1:
              raise SystemExit('guard marker not unique')
          text = text.replace(old_guard, new_guard, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify Task 2 GREEN and legacy permission paths
        run: |
          uv run pytest -q \
            tests/smoke/test_sovereign_mode.py \
            tests/smoke/test_trust_mode_safety.py \
            tests/smoke/test_grants.py \
            tests/smoke/test_autonomy.py

      - name: Commit verified Task 2
        run: |
          git config user.name 'computer-use audit bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/computeruse/agent.py
          git commit -m 'refactor(security): isolate sovereign permission path'
          git push origin HEAD:feat/sovereign-mode-core
