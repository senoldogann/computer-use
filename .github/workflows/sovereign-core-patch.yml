name: Sovereign core patch

on:
  push:
    branches: [feat/sovereign-mode-core]

permissions:
  contents: write

jobs:
  task4:
    if: contains(github.event.head_commit.message, 'apply sovereign task4')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sovereign-mode-core

      - uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated JavaScript runtime
        run: npm ci --prefix src/computeruse/repl --ignore-scripts

      - name: Patch sovereign startup validation exactly
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/computeruse/cli.py')
          text = path.read_text(encoding='utf-8')

          reject_marker = (
              "def _reject_unusable_arguments(args: argparse.Namespace) -> int | None:\n"
              "    \"\"\"Exit code for a combination that cannot start, else ``None``.\"\"\"\n"
              "    if getattr(args, \"yes\", False) and getattr(args, \"level\", 3) in (0, 1):\n"
          )
          replacement = (
              "def _has_hard_budget(args: argparse.Namespace) -> bool:\n"
              "    \"\"\"Whether this invocation has an explicit finite runtime/spend ceiling.\"\"\"\n"
              "    return any(\n"
              "        value is not None\n"
              "        for value in (args.deadline_seconds, args.max_tokens, args.max_cost)\n"
              "    )\n\n\n"
              "def _reject_unusable_arguments(args: argparse.Namespace) -> int | None:\n"
              "    \"\"\"Exit code for a combination that cannot start, else ``None``.\"\"\"\n"
              "    if getattr(args, \"sovereign\", False):\n"
              "        if getattr(args, \"yes\", False):\n"
              "            print(\n"
              "                \"error: --sovereign is separate from --yes; choose one mode\",\n"
              "                file=sys.stderr,\n"
              "            )\n"
              "            return 2\n"
              "        if getattr(args, \"level\", AutonomyLevel.FULL.value) in (0, 1, 2):\n"
              "            print(\n"
              "                \"error: --sovereign cannot be combined with --level 0/1/2\",\n"
              "                file=sys.stderr,\n"
              "            )\n"
              "            return 2\n"
              "        if not _has_hard_budget(args):\n"
              "            print(\n"
              "                \"error: --sovereign requires at least one of --deadline-seconds, \"\n"
              "                \"--max-tokens or --max-cost\",\n"
              "                file=sys.stderr,\n"
              "            )\n"
              "            return 2\n"
              "    if getattr(args, \"yes\", False) and getattr(args, \"level\", 3) in (0, 1):\n"
          )
          if text.count(reject_marker) != 1:
              raise SystemExit('startup validation marker not unique')
          text = text.replace(reject_marker, replacement, 1)

          budget_block = (
              "    if (\n"
              "        args.deadline_seconds is None\n"
              "        and args.max_tokens is None\n"
              "        and args.max_cost is None\n"
              "    ):\n"
          )
          if text.count(budget_block) != 1:
              raise SystemExit('autonomous budget marker not unique')
          text = text.replace(budget_block, "    if not _has_hard_budget(args):\n", 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify Task 4 GREEN and shared budget behavior
        run: |
          uv run ruff check src/computeruse/cli.py tests/smoke/test_sovereign_mode.py
          uv run pyright
          uv run pytest -q \
            tests/smoke/test_sovereign_mode.py \
            tests/smoke/test_budget.py \
            tests/smoke/test_folder_watch.py

      - name: Commit verified Task 4
        run: |
          git config user.name 'computer-use audit bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/computeruse/cli.py
          git commit -m 'fix(cli): bound sovereign startup'
          git push origin HEAD:feat/sovereign-mode-core
