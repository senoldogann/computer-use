name: Sovereign core patch

on:
  push:
    branches: [feat/sovereign-mode-core]

permissions:
  contents: write

jobs:
  task2:
    if: contains(github.event.head_commit.message, 'apply sovereign task2 fixed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sovereign-mode-core

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --dev

      - name: Patch sovereign guard composition exactly
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/computeruse/agent.py')
          text = path.read_text(encoding='utf-8')

          old_import = (
              "from computeruse.security.autonomy import (\n"
              "    AutonomyLevel,\n"
              "    PermissionDecision,\n"
              "    Risk,\n"
              "    classify_risk,\n"
              ")\n"
          )
          new_import = (
              "from computeruse.security.autonomy import (\n"
              "    AutonomyLevel,\n"
              "    PermissionDecision,\n"
              "    Risk,\n"
              "    classify_risk,\n"
              "    decide_permission,\n"
              ")\n"
          )
          if text.count(old_import) != 1:
              raise SystemExit('autonomy import marker not unique')
          text = text.replace(old_import, new_import, 1)

          old_guard = (
              "        risk = classify_risk(turn, target_label=label)\n"
              "        verdict = (\n"
              "            authorize(turn, label)\n"
              "            if authorize is not None and risk is Risk.DESTRUCTIVE\n"
              "            else None\n"
              "        )\n"
              "        base = decide_with_grant(level, risk, verdict)\n"
          )
          new_guard = (
              "        risk = classify_risk(turn, target_label=label)\n"
              "        # Resolve base policy before consulting delegated authority.\n"
              "        # Sovereign already permits destructive work by explicit session policy;\n"
              "        # FULL/GUARDED consult grants only when confirmation is still required.\n"
              "        base = decide_permission(level, risk)\n"
              "        if (\n"
              "            base is PermissionDecision.CONFIRM\n"
              "            and risk is Risk.DESTRUCTIVE\n"
              "            and authorize is not None\n"
              "        ):\n"
              "            base = decide_with_grant(level, risk, authorize(turn, label))\n"
          )
          if text.count(old_guard) != 1:
              raise SystemExit('guard marker not unique')
          text = text.replace(old_guard, new_guard, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify Task 2 GREEN and legacy permission paths
        run: |
          uv run pytest -q \
            tests/smoke/test_sovereign_mode.py \
            tests/smoke/test_trust_mode_safety.py \
            tests/smoke/test_grants.py \
            tests/smoke/test_autonomy.py

      - name: Commit verified Task 2
        run: |
          git config user.name 'computer-use audit bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/computeruse/agent.py
          git commit -m 'refactor(security): isolate sovereign permission path'
          git push origin HEAD:feat/sovereign-mode-core
