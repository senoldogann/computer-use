name: Sovereign core patch

on:
  push:
    branches: [feat/sovereign-mode-core]

permissions:
  contents: write

jobs:
  task3:
    if: contains(github.event.head_commit.message, 'apply sovereign task3 runtime')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sovereign-mode-core

      - uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated JavaScript runtime
        run: npm ci --prefix src/computeruse/repl --ignore-scripts

      - name: Patch explicit sovereign CLI activation exactly
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/computeruse/cli.py')
          text = path.read_text(encoding='utf-8')

          level_block = (
              "    parser.add_argument(\n"
              "        \"--level\",\n"
              "        type=int,\n"
              "        choices=[0, 1, 2, 3],\n"
              "        default=AutonomyLevel.FULL.value,\n"
              "        help=\"Autonomy level 0-3 (default: 3 = full). Destructive actions still \"\n"
              "        \"require explicit approval or a scoped grant, including with --yes.\",\n"
              "    )\n"
          )
          sovereign_block = level_block + (
              "    parser.add_argument(\n"
              "        \"--sovereign\",\n"
              "        action=\"store_true\",\n"
              "        help=\"Explicitly delegate destructive permission for this session. \"\n"
              "        \"This selects Sovereign autonomy without exposing it through --level; \"\n"
              "        \"kill-switch, budgets, verification, completion audit, trace and driver \"\n"
              "        \"safety gates remain active.\",\n"
              "    )\n"
          )
          if text.count(level_block) != 1:
              raise SystemExit('level parser marker not unique')
          text = text.replace(level_block, sovereign_block, 1)

          parse_return = "    return parser.parse_args(argv)\n\n\ndef scripted_provider("
          resolver = (
              "    return parser.parse_args(argv)\n\n\n"
              "def resolve_autonomy_level(args: argparse.Namespace) -> AutonomyLevel:\n"
              "    \"\"\"Resolve the operator-selected autonomy mode.\n\n"
              "    Sovereign is intentionally not part of the numeric --level surface: it\n"
              "    requires the dedicated explicit switch so ordinary level selection cannot\n"
              "    accidentally delegate destructive permission.\n"
              "    \"\"\"\n"
              "    if bool(getattr(args, \"sovereign\", False)):\n"
              "        return AutonomyLevel.SOVEREIGN\n"
              "    return AutonomyLevel(args.level)\n\n\n"
              "def scripted_provider("
          )
          if text.count(parse_return) != 1:
              raise SystemExit('parse return marker not unique')
          text = text.replace(parse_return, resolver, 1)

          old_config = "        autonomy_level=AutonomyLevel(args.level),\n"
          new_config = "        autonomy_level=resolve_autonomy_level(args),\n"
          if text.count(old_config) != 1:
              raise SystemExit('AgentConfig autonomy marker not unique')
          text = text.replace(old_config, new_config, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify Task 3 GREEN
        run: |
          uv run ruff check src/computeruse/cli.py tests/smoke/test_sovereign_mode.py
          uv run pyright
          uv run pytest -q tests/smoke/test_sovereign_mode.py tests/smoke/test_agent.py

      - name: Commit verified Task 3
        run: |
          git config user.name 'computer-use audit bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/computeruse/cli.py
          git commit -m 'feat(cli): add explicit sovereign activation'
          git push origin HEAD:feat/sovereign-mode-core
