name: Audit research evidence hardening

on:
  push:
    branches: [audit/research-evidence-hardening-2026-09-07]

permissions:
  contents: write

jobs:
  red-green:
    if: github.event.head_commit.message == 'chore(audit): bootstrap research hardening verification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/research-evidence-hardening-2026-09-07

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          uv sync --dev
          npm ci --prefix src/computeruse/repl --ignore-scripts
          cargo build --manifest-path driver/Cargo.toml

      - name: Add regression tests first
        run: |
          python - <<'PY'
          from pathlib import Path

          regressions = Path('tests/smoke/test_regressions.py')
          text = regressions.read_text(encoding='utf-8')
          marker = 'def test_repeated_same_tool_calls_preserve_distinct_research_evidence'
          if marker not in text:
              text += r'''


def test_repeated_same_tool_calls_preserve_distinct_research_evidence(monkeypatch) -> None:
    """Different research calls through one MCP tool must not overwrite each other.

    A live AI-news run called the same Exa search tool with three different
    queries. The actor trail keyed tool evidence only by tool name, so every
    call replaced the previous answer. The model then claimed it had collected
    five developments while its actual working context contained only the
    newest search result.
    """
    from computeruse.orchestrator.schemas import CallTool

    seen: list[WorkingState] = []
    answers = iter((
        'Reuters: OpenAI launches Astra',
        'Nature: clinical AI evaluation shifts toward patient outcomes',
    ))

    def provider(state: WorkingState) -> AgentTurn:
        seen.append(state)
        if state.step_index == 0:
            return AgentTurn(
                thought='search one source set',
                sub_goal='collect Reuters candidates',
                action=CallTool(
                    type='call_tool',
                    tool='exa.web_search_exa',
                    arguments={'query': 'AI Reuters Astra'},
                ),
            )
        if state.step_index == 1:
            return AgentTurn(
                thought='search another source set',
                sub_goal='collect Nature candidates',
                action=CallTool(
                    type='call_tool',
                    tool='exa.web_search_exa',
                    arguments={'query': 'AI Nature clinical'},
                ),
            )
        return AgentTurn(
            thought='research evidence collected',
            sub_goal='finish',
            action=Finish(type='finish', status='success', summary='done'),
        )

    monkeypatch.setattr(OodaRunner, '_run_tool', lambda _self, _action: next(answers))
    final = OodaRunner(
        provider=provider,
        execute_physical=lambda _action: None,
        max_steps=5,
    ).run(goal='research two distinct AI developments')

    actor_trail = seen[-1].observed_trail
    assert any('Reuters: OpenAI launches Astra' in item for item in actor_trail), actor_trail
    assert any('Nature: clinical AI evaluation' in item for item in actor_trail), actor_trail
    assert any(
        item.startswith('call_tool exa.web_search_exa:') for item in final.tool_history
    ), final.tool_history
'''
              regressions.write_text(text, encoding='utf-8')

          prompts = Path('tests/smoke/test_prompts.py')
          text = prompts.read_text(encoding='utf-8')
          marker = 'def test_research_contract_requires_source_verification'
          if marker not in text:
              text += r'''


def test_research_contract_requires_source_verification() -> None:
    """Search snippets may discover candidates, but cannot silently become research evidence."""
    from computeruse.orchestrator.prompts import ACTION_CONTRACT, COMPLETION_AUDIT_CONTRACT

    assert 'SEARCH RESULTS ARE DISCOVERY, NOT SOURCE VERIFICATION' in ACTION_CONTRACT
    assert 'open or fetch the source you actually rely on' in ACTION_CONTRACT
    assert 'collect more candidates than the requested final count' in ACTION_CONTRACT
    assert 'distinguish discovery evidence from source verification' in COMPLETION_AUDIT_CONTRACT
'''
              prompts.write_text(text, encoding='utf-8')
          PY

      - name: RED - prove both regressions fail before production changes
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            'tests/smoke/test_regressions.py::test_repeated_same_tool_calls_preserve_distinct_research_evidence'
            'tests/smoke/test_prompts.py::test_research_contract_requires_source_verification'
          )
          for test_spec in "${tests[@]}"; do
            set +e
            uv run pytest -q "$test_spec" >/tmp/red.log 2>&1
            rc=$?
            set -e
            cat /tmp/red.log
            if [ "$rc" -eq 0 ]; then
              echo "Expected RED but test passed: $test_spec" >&2
              exit 1
            fi
            if [ "$rc" -ne 1 ]; then
              echo "Test did not fail by assertion (pytest rc=$rc): $test_spec" >&2
              exit "$rc"
            fi
          done

      - name: Apply minimal production fix
        run: |
          python - <<'PY'
          from pathlib import Path

          loop = Path('src/computeruse/orchestrator/loop.py')
          text = loop.read_text(encoding='utf-8')
          old = '''                    observed_trail=_extend_trail_entry(
                        state.observed_trail,
                        title=_tool_trail_title(outcome.action),
                        text=answer,
                        max_entries=TRAIL_MAX_ENTRIES,
                    ),'''
          new = '''                    observed_trail=_extend_trail_entry(
                        state.observed_trail,
                        # A tool name is not an evidence identity. Research commonly
                        # calls the same search tool with several different queries;
                        # keying by tool name made each answer overwrite the previous
                        # one in the actor's working trail. The step makes each
                        # machine-observed answer independently addressable while the
                        # bounded trail still caps context growth.
                        title=f"{_tool_trail_title(outcome.action)} @ step {outcome.step_index}",
                        text=answer,
                        max_entries=TRAIL_MAX_ENTRIES,
                    ),'''
          if old not in text:
              raise SystemExit('loop actor-trail patch marker not found')
          text = text.replace(old, new, 1)

          old = '                    tool_history=_extend_tool_history(state.tool_history, answer),'
          new = '''                    tool_history=_extend_tool_history(
                        state.tool_history,
                        # Preserve provenance for the completion auditor. A raw
                        # answer cannot tell it whether evidence came from a search,
                        # a fetched page, or another MCP tool.
                        f"{_tool_trail_title(outcome.action)}: {answer}",
                    ),'''
          if old not in text:
              raise SystemExit('loop tool-history patch marker not found')
          text = text.replace(old, new, 1)
          loop.write_text(text, encoding='utf-8')

          prompts = Path('src/computeruse/orchestrator/prompts.py')
          text = prompts.read_text(encoding='utf-8')
          old = '''    "   - Do NOT click browser chrome (tab bar, address bar, toolbar) when you mean a page element.\\n"
    "\\n"
    "7. READING WEB TEXT — NEVER ZOOM TO READ:\\n"'''
          new = '''    "   - Do NOT click browser chrome (tab bar, address bar, toolbar) when you mean a page element.\\n"
    "\\n"
    "   RESEARCH EVIDENCE DISCIPLINE:\\n"
    "   - SEARCH RESULTS ARE DISCOVERY, NOT SOURCE VERIFICATION. A search-result title or snippet\\n"
    "     tells you which source to inspect; it does not license details that are absent from that\\n"
    "     snippet. For research, current-events, comparison, or summarization goals, open or fetch\\n"
    "     the source you actually rely on and read the relevant source content before using its claim.\\n"
    "   - When the goal asks for N 'most important', 'top', or 'best' items, collect more candidates\\n"
    "     than the requested final count when feasible, then deduplicate and select using evidence\\n"
    "     such as recency, source quality, and impact. The first N search hits are not automatically\\n"
    "     the top N.\\n"
    "   - Keep provenance attached to every selected claim: source title/domain (and URL when useful)\\n"
    "     must remain identifiable when you synthesize several sources. Never merge a snippet from\\n"
    "     one result with details from another and present the combination as one sourced fact.\\n"
    "\\n"
    "7. READING WEB TEXT — NEVER ZOOM TO READ:\\n"'''
          if old not in text:
              raise SystemExit('ACTION_CONTRACT research marker not found')
          text = text.replace(old, new, 1)

          old = '''    "- Live, time-varying values returned by tools (asset prices, exchange rates, timestamps,\\n"'''
          new = '''    "- For research goals, distinguish discovery evidence from source verification. A tool-history\\n"
    "  entry labelled as a search call proves only what that returned result actually contains —\\n"
    "  typically candidate titles, URLs and snippets. If a final claim adds details beyond that\\n"
    "  evidence, require a fetched/opened source or machine-observed page content supporting them.\\n"
    "  For multi-source goals, also verify that the requested number of distinct sources is evidenced\\n"
    "  and that selected claims retain identifiable provenance.\\n"
    "- Live, time-varying values returned by tools (asset prices, exchange rates, timestamps,\\n"'''
          if old not in text:
              raise SystemExit('completion audit research marker not found')
          text = text.replace(old, new, 1)
          prompts.write_text(text, encoding='utf-8')
          PY

      - name: GREEN - targeted regressions
        run: |
          uv run pytest -q \
            tests/smoke/test_regressions.py::test_repeated_same_tool_calls_preserve_distinct_research_evidence \
            tests/smoke/test_prompts.py::test_research_contract_requires_source_verification

      - name: Python quality gates
        run: |
          uv run ruff check .
          uv run pyright
          uv run pytest -q --tb=short

      - name: Rust quality gates
        run: |
          cargo test --manifest-path driver/Cargo.toml --all-targets
          cargo clippy --manifest-path driver/Cargo.toml --all-targets -- -D warnings

      - name: Commit verified fix to audit branch
        run: |
          git config user.name 'computer-use audit bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/computeruse/orchestrator/loop.py src/computeruse/orchestrator/prompts.py \
                  tests/smoke/test_regressions.py tests/smoke/test_prompts.py
          git commit -m 'fix(orchestrator): preserve research evidence provenance'
          git push origin HEAD:audit/research-evidence-hardening-2026-09-07
