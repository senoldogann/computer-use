[project]
name = "computeruse"
version = "0.1.0"
description = "Autonomous physical computer-use framework — macOS host, human-like actuation."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
all = [
    "pyright>=1.1.0",
    "pytest>=8.0.0",
]

[project.scripts]
computeruse = "computeruse.cli:main"

[tool.ruff]
target-version = "py312"
# Deliberately no explicit `select`: ruff's curated default rule set is the
# gate. The repo is lint-clean under it today; version drift surfaces in CI.

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
strict = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "ruff>=0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/computeruse"]
